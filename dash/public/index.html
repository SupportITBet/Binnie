    <title>BET Admin</title>
    <!-- Applique la couleur choisie par l'utilisateur AVANT que les modules JS ne lisent localStorage -->
    <script>
      (function () {
        var c = sessionStorage.getItem('_bet_color');
        if (c) {
          try {
            var p = JSON.parse(localStorage.getItem('admin_profil') || '{}');
            p.couleur = c;
            localStorage.setItem('admin_profil', JSON.stringify(p));
          } catch (e) {}
          sessionStorage.removeItem('_bet_color');
        }
      })();
    </script>
