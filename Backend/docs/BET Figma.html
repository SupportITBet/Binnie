<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BET Languages — Prototype Apprenant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#dc2626;--pd:#b91c1c;--pl:#fef2f2;--s:#1e3a8a;--sm:#2563eb;--n9:#111827;--n6:#4b5563;--n3:#d1d5db;--n1:#f3f4f6;--n0:#f8fafc;--w:#ffffff;--ok:#059669;--warn:#d97706;--purp:#7c3aed;--grad:linear-gradient(135deg,#1e3a8a 0%,#dc2626 100%);--f:'Plus Jakarta Sans',-apple-system,sans-serif;--r8:8px;--r10:10px;--r12:12px;--r16:16px;--scard:0 2px 8px rgba(0,0,0,.06);--smodal:0 8px 32px rgba(0,0,0,.16);--sbtn:0 4px 12px rgba(220,38,38,.3)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:#0d0d1a;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:24px;padding:20px}
h1,h2,h3,p,span,div,button,input,label{font-family:var(--f)}
button{cursor:pointer;border:none;background:none;font-family:var(--f)}
input{font-family:var(--f);outline:none;border:none}

/* SIDEBAR NAV */
.sidebar{display:flex;flex-direction:column;gap:6px;padding:8px;background:rgba(255,255,255,.05);border-radius:16px;max-height:844px;overflow-y:auto;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.nav-btn{background:transparent;color:rgba(255,255,255,.6);font-size:11px;padding:8px 12px;border-radius:10px;cursor:pointer;text-align:left;white-space:nowrap;transition:all .15s;border:none;font-family:var(--f);font-weight:500}
.nav-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-btn.current{background:var(--p);color:#fff}
.nav-section{color:rgba(255,255,255,.3);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px 4px;pointer-events:none}

/* DEVICE */
.device{width:390px;height:844px;background:var(--n0);border-radius:50px;overflow:hidden;position:relative;box-shadow:0 0 0 2px rgba(255,255,255,.08),0 40px 100px rgba(0,0,0,.6);flex-shrink:0}
#app{width:100%;height:100%;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;background:var(--n0);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;flex-direction:column;display:none}
.screen.active{display:flex}

/* TRANSITIONS */
@keyframes fadeSlide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.anim-slide{animation:fadeSlide .25s ease}
.anim-up{animation:slideUp .3s ease}
.anim-fade{animation:fadeIn .2s ease}

/* HEADER */
.hdr-grad{background:var(--grad);padding:54px 20px 20px;color:#fff;flex-shrink:0}
.hdr-plain{background:#fff;padding:54px 20px 14px;border-bottom:1px solid var(--n3);display:flex;align-items:center;gap:12px;flex-shrink:0}
.hdr-exam{background:var(--p);padding:54px 20px 14px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;transition:background .3s}

/* BOTTOM TABS */
.btabs{position:absolute;bottom:0;left:0;right:0;height:82px;background:#fff;border-top:1px solid var(--n3);display:flex;align-items:flex-start;padding-top:10px;z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.tab-ico{font-size:22px;line-height:1}
.tab-lbl{font-size:10px;font-weight:600;color:var(--n6)}
.tab.on .tab-lbl{color:var(--p)}
.tbadge{position:absolute;top:0;right:calc(50% - 24px);background:var(--p);color:#fff;border-radius:10px;font-size:9px;font-weight:700;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* SCROLL WRAPPER */
.scrl{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:90px}
.scrl::-webkit-scrollbar{width:0}

/* BUTTONS */
.btn-p{width:100%;height:48px;background:var(--p);color:#fff;border-radius:var(--r10);font-size:16px;font-weight:700;box-shadow:var(--sbtn);transition:background .15s,transform .1s;border:none}
.btn-p:active{background:var(--pd);transform:scale(.98)}
.btn-s{width:100%;height:48px;background:transparent;color:var(--p);border:2px solid var(--p);border-radius:var(--r10);font-size:16px;font-weight:700;transition:all .15s}
.btn-sm{height:36px;padding:0 16px;border-radius:8px;font-size:13px;font-weight:700;background:var(--p);color:#fff;border:none;white-space:nowrap}
.btn-sm-o{height:36px;padding:0 16px;border-radius:8px;font-size:13px;font-weight:700;background:transparent;color:var(--s);border:2px solid var(--s);white-space:nowrap}
.btn-ghost-w{background:rgba(255,255,255,.2);color:#fff;border-radius:var(--r10);font-size:15px;font-weight:600;padding:10px 20px;backdrop-filter:blur(4px)}

/* CARDS */
/* GRILLE D'INDICATEURS — ces cinq classes etaient utilisees par l'accueil sans jamais
   avoir ete ecrites : les quatre tuiles s'empilaient en vrac, sans cadre ni alignement. */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 16px 12px}
.stat-card{background:#fff;border-radius:var(--r12);padding:12px 6px;box-shadow:var(--scard);text-align:center}
.stat-icon{font-size:19px;line-height:1;margin-bottom:5px}
.stat-value{font-size:16px;font-weight:800;color:var(--n9);line-height:1.15}
.stat-label{font-size:9.5px;color:var(--n6);margin-top:2px;font-weight:600;line-height:1.2}

/* ACCES A TOUS LES ESPACES — la barre du bas ne tient que cinq onglets ; les autres
   ecrans n'auraient aucun point d'entree sans cette grille. */
.esp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px 14px}
.esp{background:#fff;border-radius:var(--r12);padding:12px 4px;box-shadow:var(--scard);text-align:center;cursor:pointer;transition:transform .1s;position:relative}
.esp:active{transform:scale(.95)}
.esp-ico{font-size:22px;line-height:1;margin-bottom:6px}
.esp-lbl{font-size:10px;font-weight:600;color:var(--n6);line-height:1.25}
.esp-bdg{position:absolute;top:6px;right:8px;background:var(--p);color:#fff;border-radius:9px;font-size:9px;font-weight:700;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:#fff;border-radius:var(--r12);padding:14px;box-shadow:var(--scard);margin:0 16px 12px}
.card-tap{cursor:pointer;transition:transform .1s,box-shadow .1s}
.card-tap:active{transform:scale(.98);box-shadow:none}

/* BADGES */
.bdg{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.bdg-blue{background:#dbeafe;color:#1e40af}
.bdg-red{background:#fee2e2;color:#b91c1c}
.bdg-green{background:#d1fae5;color:#065f46}
.bdg-orange{background:#ffedd5;color:#9a3412}
.bdg-purple{background:#ede9fe;color:#5b21b6}
.bdg-gray{background:var(--n1);color:var(--n6)}
.bdg-teal{background:#ccfbf1;color:#0f766e}

/* PROGRESS */
.pbar{height:6px;background:var(--n1);border-radius:4px;overflow:hidden}
.pfill{height:100%;border-radius:4px;transition:width .4s ease}

/* AVATARS */
.av{border-radius:50%;background:var(--grad);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av32{width:32px;height:32px;font-size:12px}
.av48{width:48px;height:48px;font-size:16px}
.av80{width:80px;height:80px;font-size:24px}

/* CHIPS */
.chips{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;border:1.5px solid var(--n3);background:#fff;color:var(--n6);transition:all .15s}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}

/* INPUTS */
.inp-wrap{position:relative}
.inp{width:100%;height:48px;border:1.5px solid var(--n3);border-radius:var(--r10);padding:0 14px 0 44px;font-size:15px;font-family:var(--f);color:var(--n9);background:#fff;transition:border-color .15s}
.inp:focus{border-color:var(--p)}
.inp-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--n6);font-size:18px;pointer-events:none}
.inp-right{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--n6);font-size:18px;cursor:pointer}

/* SECTION HEADS */
.sec-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.sec-ttl{font-size:16px;font-weight:700;color:var(--n9)}
.sec-lnk{font-size:13px;font-weight:700;color:var(--p);cursor:pointer}

/* OVERLAY */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end}
.overlay.on{display:flex}
.bsheet{background:#fff;border-radius:20px 20px 0 0;width:100%;padding:0 0 40px;animation:slideUp .3s ease;max-height:90%;overflow-y:auto}
.bsheet-inner{background:#fff;border-radius:20px 20px 0 0;width:100%;padding:0 0 40px;animation:slideUp .3s ease;overflow-y:auto}
.handle{width:40px;height:4px;background:var(--n3);border-radius:2px;margin:12px auto 16px}

/* MISC */
.divider{height:1px;background:var(--n1);margin:8px 16px}
.thick-div{height:8px;background:var(--n0);margin:4px 0}
.back-w{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none}
.back-d{width:36px;height:36px;border-radius:50%;color:var(--n9);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;background:none}
.star-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,215,0,.2);color:#fbbf24;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
.info-row{display:flex;align-items:center;gap:10px;padding:12px 16px}
.info-row-ico{font-size:18px;flex-shrink:0}
.info-lbl{font-size:13px;color:var(--n6);flex:1}
.info-val{font-size:14px;font-weight:600;color:var(--n9);text-align:right}
.chat-bubble{background:var(--n1);border-radius:4px 16px 16px 16px;padding:12px 16px;max-width:80%;margin:0 0 10px 16px}
.chat-meta{font-size:11px;color:var(--n6);margin:0 0 6px 16px}
.exam-opt{width:100%;text-align:left;padding:14px 16px;border-radius:var(--r10);border:1.5px solid var(--n3);background:#fff;font-size:15px;color:var(--n9);margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;font-family:var(--f);font-weight:500}
.exam-opt.sel{border-color:var(--p);background:var(--pl);color:var(--p);font-weight:600}
.exam-opt.cor{border-color:var(--ok);background:#d1fae5;color:#065f46}
.exam-opt.wrg{border-color:var(--p);background:#fee2e2;color:#b91c1c}
.opt-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--n3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.opt-dot.sel{border-color:var(--p);background:var(--p)}
.opt-dot.sel::after{content:'';width:8px;height:8px;background:#fff;border-radius:50%}
.pay-opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r12);border:2px solid var(--n3);cursor:pointer;margin:0 20px 10px;transition:border-color .15s}
.pay-opt.sel{border-color:var(--p)}
.pay-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
/* Circular SVG ring */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring-text{position:absolute;text-align:center;line-height:1.2}
/* Scrollable horizontal cards */
.hscrl{display:flex;gap:12px;padding:4px 16px 8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscrl::-webkit-scrollbar{display:none}
/* Session card */
.sess-card{background:#fff;border-radius:var(--r12);padding:14px;box-shadow:var(--scard);min-width:200px;cursor:pointer;flex-shrink:0;transition:transform .1s}
.sess-card:active{transform:scale(.97)}
/* Warning overlay for exam */
#warn-overlay{position:absolute;inset:0;background:rgba(185,28,28,.95);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px}
#warn-overlay.on{display:flex;animation:fadeIn .2s ease}
/* Timer color */
.timer-urgent{color:#fca5a5 !important}
/* Profile sections */
.psec{background:#fff;margin:0 0 8px;padding:4px 0}
.prow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--n0)}
.prow:last-child{border-bottom:none}
/* Resource card */
.res-card{background:#fff;border-radius:var(--r12);padding:14px;box-shadow:var(--scard);margin:0 16px 10px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:transform .1s}
.res-card:active{transform:scale(.98)}
.res-ico{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
/* Alert */
.alert{border-radius:var(--r12);padding:14px;margin:0 16px 12px;border:1.5px solid}
.alert-w{background:#fffbeb;border-color:#fcd34d}
.alert-b{background:#eff6ff;border-color:#bfdbfe}
/* Step indicator for exam */
.step-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);display:inline-block;margin:0 3px;transition:background .2s}
.step-dot.done{background:rgba(255,255,255,.8)}
.step-dot.active{background:#fff;width:24px;border-radius:4px}
/* Shop grid */
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.shop-card{background:#fff;border-radius:var(--r12);padding:14px;box-shadow:var(--scard);display:flex;flex-direction:column;gap:8px}
.shop-ico{width:100%;height:80px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:4px}
/* Objective bar */
.obj-item{margin:0 16px 12px}
.obj-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.obj-name{font-size:14px;font-weight:600;color:var(--n9)}
.obj-pct{font-size:14px;font-weight:700}
.obj-sub{font-size:12px;color:var(--n6);margin-bottom:6px}
/* Module item */
.mod-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--n0)}
.mod-item:last-child{border-bottom:none}
/* Notification dot */
.notif-dot{width:10px;height:10px;border-radius:50%;background:var(--p);flex-shrink:0}
</style>
</head>
<body>

<script>
/* ============================================================
   STATE
============================================================ */
const S = {
  screen: 'splash',
  tab: 'home',
  examQ: 0,
  answers: {},
  examWarning: false,
  selectedPay: 'orange',
  filterExam: 'all',
  filterRes: 'all',
  timerSec: 1122,
  timerInterval: null,
  showExamWarning: false,
  shopItem: null,
  msgChip: 'all',
  // Course module state
  expandedModule: -1,
  modQuizActive: false,
  modQuizQ: 0,
  modQuizAnswers: {},
  modQuizDone: false,
  completedLessons: {},   // key: "courseIdx_modIdx_lessonIdx"
  completedModules: {},   // key: "courseIdx_modIdx" => score
  currentLesson: null,    // {courseIdx, modIdx, lessonIdx}
};

const COURSES = [
  {id:1, emoji:'💼', title:'Anglais Pro B2', prof:'Prof. Martin', pct:82, color:'#2563eb', bg:'#dbeafe', badge:'B2', status:'En cours', hours:'20h / 24h', next:'12/12', modules:['Réunions d\'affaires','Négociation','Présentations','Correspondance','Rapport écrit'], done:[0,1,2]},
  {id:2, emoji:'🗣️', title:'Oral & Prononciation', prof:'Prof. Dupont', pct:65, color:'#059669', bg:'#d1fae5', badge:'B1', status:'En cours', hours:'12h / 20h', next:'14/12', modules:['Sons anglais','Intonation','Liaisons','Discours formel','Présentation'], done:[0,1,2]},
  {id:3, emoji:'✍️', title:'Business Writing', prof:'Prof. James', pct:40, color:'#7c3aed', bg:'#ede9fe', badge:'B2+', status:'En cours', hours:'8h / 20h', next:'11/12', modules:['Emails pro','Rapports','Propositions','Contrats','Synthèses'], done:[0,1]},
  {id:4, emoji:'🌍', title:'Anglais Général C1', prof:'Prof. Martin', pct:95, color:'#d97706', bg:'#ffedd5', badge:'C1', status:'Terminé', hours:'24h / 24h', next:'—', modules:['Grammaire avancée','Littérature','Actualités','Débat','Argumentation'], done:[0,1,2,3,4]},
];

const EXAMS = [
  {id:1, type:'eval', typeLabel:'Évaluation', color:'purple', title:'Évaluation Module 3', course:'Anglais Pro B2', prof:'Prof. Martin', duration:'20 min', qs:10, minScore:60, deadline:'20/12/2025', status:'available'},

/* ============================================================
   NAVIGATION
============================================================ */
function go(scr, extra={}) {
  clearTimer();
  Object.assign(S, extra);
  S.screen = scr;
  render();
  // Update sidebar
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('current', b.getAttribute('onclick') === `go('${scr}')`);
  });
  if(scr === 'examActive') startTimer();
}

function goTab(tab) {
  S.tab = tab;
  go(tab);
}

function clearTimer() {
  if(S.timerInterval) { clearInterval(S.timerInterval); S.timerInterval = null; }
}

function startTimer() {
  S.timerSec = 1122;
  S.timerInterval = setInterval(() => {
    S.timerSec = Math.max(0, S.timerSec - 1);
    const el = document.getElementById('timer-display');
    if(el) {
      const m = Math.floor(S.timerSec/60), s = S.timerSec%60;
      el.textContent = `⏱ ${m}:${s.toString().padStart(2,'0')}`;
      if(S.timerSec < 60) el.classList.add('timer-urgent');
    }
    if(S.timerSec === 0) { clearTimer(); go('examResults'); }
  }, 1000);
}

function ring(pct, size, color, label, sub='') {
  const r = (size-12)/2, cx = size/2, cy = size/2;
  const circ = 2*Math.PI*r, fill = circ*(pct/100), empty = circ-fill;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f3f4f6" stroke-width="8"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="8"
        stroke-dasharray="${fill} ${empty}" stroke-linecap="round"/>
    </svg>
    <div class="ring-text">
      <div style="font-size:${size>70?18:13}px;font-weight:800;color:#111827">${pct}%</div>
      ${label?`<div style="font-size:10px;color:#6b7280">${label}</div>`:''}
    </div>
  </div>`;
}

/* ============================================================
   COURSE MODULE HELPERS
============================================================ */
function toggleModule(idx) {
  if(S.expandedModule === idx) {
    S.expandedModule = -1;
  } else {
    S.expandedModule = idx;
    S.modQuizActive = false;
    S.modQuizQ = 0;
    S.modQuizAnswers = {};
    S.modQuizDone = false;
  }
  render();
}

function startModQuiz() {
  S.modQuizActive = true;
  S.modQuizQ = 0;
  S.modQuizAnswers = {};
  S.modQuizDone = false;
  render();
}

function selectModAnswer(qi, ai) {
  S.modQuizAnswers[qi] = ai;
  render();
}

function nextModQ(total) {
  if(S.modQuizQ < total - 1) {
    S.modQuizQ++;
    render();
  }
}

function submitModQuiz(ci, mi, total) {
  S.modQuizDone = true;
  const mc = MODULE_CONTENT[ci] && MODULE_CONTENT[ci][mi];
  if(mc) {
    let correct = 0;
    mc.quiz.questions.forEach((q,i) => { if(S.modQuizAnswers[i] === q.correct) correct++; });
    const score = Math.round((correct/total)*100);
    if(score >= 60) S.completedModules[ci+'_'+mi] = score;
  }
  render();
}

function markLessonDone(ci, mi, li) {
  S.completedLessons[ci+'_'+mi+'_'+li] = true;
  render();
}

/* ============================================================
   SCREEN: COURSE DETAIL
============================================================ */
function courseDetail() {
  const ci = S.selectedCourse || 0;
  const c = COURSES[ci];
  const mods = MODULE_CONTENT[ci] || [];

  const lessonTypeColors = {video:'#fee2e2', reading:'#dbeafe', audio:'#d1fae5', exercise:'#ede9fe'};
  const lessonTypeLabels = {video:'Vidéo', reading:'Lecture', audio:'Audio', exercise:'Exercice'};
  const lessonBadgeColors = {video:'bdg-red', reading:'bdg-blue', audio:'bdg-green', exercise:'bdg-purple'};

  function renderModuleContent(m, mi) {
    const quizDone = S.modQuizDone && S.expandedModule === mi;
    const modKey = ci+'_'+mi;
    const modCompleted = S.completedModules[modKey] !== undefined;

    // Count completed lessons
    const doneLessons = m.lessons.filter((_,li) => S.completedLessons[ci+'_'+mi+'_'+li]).length;
    const allLessonsDone = doneLessons === m.lessons.length;

    if(S.modQuizActive && S.expandedModule === mi) {
      // === QUIZ IN PROGRESS ===
      if(S.modQuizDone) {
        const mc = MODULE_CONTENT[ci][mi];
        let correct = 0;
        mc.quiz.questions.forEach((q,i) => { if(S.modQuizAnswers[i] === q.correct) correct++; });
        const score = Math.round((correct/mc.quiz.questions.length)*100);
        const passed = score >= 60;
        return `
        <div style="padding:16px;border-top:1px solid var(--n0)">
          <div style="text-align:center;padding:20px;background:${passed?'#f0fdf4':'#fff5f5'};border-radius:14px;margin-bottom:12px">
            <div style="font-size:40px;margin-bottom:8px">${passed?'🎉':'😔'}</div>
            <div style="font-size:32px;font-weight:900;color:${passed?'var(--ok)':'var(--p)'}">${correct} / ${mc.quiz.questions.length}</div>
            <div style="font-size:14px;font-weight:700;color:${passed?'var(--ok)':'var(--p)'}">Score : ${score}% · ${passed?'Module validé !':'Score insuffisant (min. 60%)'}</div>
            <div class="pbar" style="margin:10px 0 0">
              <div class="pfill" style="width:${score}%;background:${passed?'var(--ok)':'var(--p)'}"></div>
            </div>
          </div>
          ${mc.quiz.questions.map((q,i) => {
            const ua = S.modQuizAnswers[i]; const ok = ua === q.correct;
            return `<div style="margin-bottom:10px;padding:10px;border-radius:10px;background:${ok?'#f0fdf4':'#fff5f5'};border:1.5px solid ${ok?'#bbf7d0':'#fecaca'}">
              <div style="font-size:12px;font-weight:700;color:${ok?'var(--ok)':'var(--p)'};margin-bottom:4px">${ok?'✅':'❌'} Q${i+1}</div>
              <div style="font-size:12px;color:var(--n9);margin-bottom:4px">${q.q}</div>
              ${!ok?`<div style="font-size:11px;color:var(--ok)">✓ Bonne réponse : ${q.opts[q.correct]}</div>`:''}
            </div>`;
          }).join('')}
          <div style="display:flex;gap:10px;margin-top:12px">
            <button class="btn-s" style="flex:1;height:40px;font-size:13px" onclick="S.modQuizActive=false;S.modQuizDone=false;S.modQuizAnswers={};render()">Réessayer</button>
            ${passed?`<button class="btn-p" style="flex:2;height:40px;font-size:13px" onclick="S.expandedModule=-1;render()">✓ Continuer</button>`:''}
          </div>
        </div>`;
      }

      // Active question
      const mc = MODULE_CONTENT[ci][mi];
      const q = mc.quiz.questions[S.modQuizQ];
      const total = mc.quiz.questions.length;
      const sel = S.modQuizAnswers[S.modQuizQ];
      const isLast = S.modQuizQ === total - 1;
      return `
      <div style="padding:14px 16px;border-top:2px solid ${c.color}20;background:${c.bg}20">
        <!-- Quiz header -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">

          <span class="bdg" style="background:${c.bg};color:${c.color}">Q${S.modQuizQ+1}/${total}</span>

        <div class="pbar" style="margin-bottom:16px">
          <div class="pfill" style="width:${((S.modQuizQ)/total)*100}%;background:${c.color}"></div>
        </div>
        <!-- Question -->
        <div style="font-size:15px;font-weight:700;color:var(--n9);line-height:1.5;margin-bottom:16px;padding:14px;background:#fff;border-radius:12px;border-left:4px solid ${c.color}">${q.q}</div>
        <!-- Options -->
        ${q.opts.map((opt,ai) => `
        <button onclick="selectModAnswer(${S.modQuizQ},${ai})" style="width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:2px solid ${sel===ai?c.color:'var(--n3)'};background:${sel===ai?c.bg:'#fff'};font-size:14px;color:${sel===ai?c.color:'var(--n9)'};margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--f);font-weight:${sel===ai?'700':'500'};transition:all .15s">
          <div style="width:20px;height:20px;border-radius:50%;border:2px solid ${sel===ai?c.color:'var(--n3)'};flex-shrink:0;display:flex;align-items:center;justify-content:center;background:${sel===ai?c.color:'transparent'}">
            ${sel===ai?`<div style="width:8px;height:8px;background:#fff;border-radius:50%"></div>`:''}
          </div>
          ${opt}
        </button>`).join('')}
        <!-- Nav buttons -->
        <div style="display:flex;gap:10px;margin-top:4px">
          ${S.modQuizQ > 0 ? `<button onclick="S.modQuizQ--;render()" style="flex:1;height:40px;border-radius:8px;border:2px solid var(--n3);background:#fff;font-size:13px;font-weight:700;color:var(--n6);cursor:pointer">← Retour</button>` : ''}

        <button onclick="S.modQuizActive=false;render()" style="width:100%;padding:8px;text-align:center;font-size:12px;color:var(--n6);background:none;border:none;cursor:pointer;margin-top:6px">Retour aux leçons</button>
      </div>`;
    }

    // === LESSONS LIST ===
    return `
    <div style="border-top:2px solid ${c.color}20;background:${c.bg}15">
      <!-- Lessons list -->
      ${m.lessons.map((l,li) => {
        const isDone = S.completedLessons[ci+'_'+mi+'_'+li];

    ${[['1','Konan Yao','3 120'],['2','Kouamé Aya','2 340'],['3','Diallo Fatou','2 180']].map(([r,n,p])=>`
    <div class="card" style="display:flex;align-items:center;gap:12px;${n==='Kouamé Aya'?'border:2px solid var(--p)':''}">
      <div style="width:26px;text-align:center;font-size:15px;font-weight:800;color:var(--n6)">${r}</div>
      <div class="av av32">${n.split(' ').map(x=>x[0]).join('')}</div>
      <div style="flex:1;font-size:14px;font-weight:${n==='Kouamé Aya'?'800':'600'};color:var(--n9)">${n}</div>
      <div style="font-size:14px;font-weight:800;color:var(--warn)">${p} XP</div>

  </div>
  ${bottomTabs('profile')}`;
}

      <div style="font-size:16px;font-weight:800;margin-bottom:6px">15 mots de vocabulaire professionnel</div>

      <button class="btn-ghost-w" style="width:100%">Commencer</button>
    </div>
    ${JEUX.map(j=>`
